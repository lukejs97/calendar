<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/contacts/contacts.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Minuteman Contacts</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Minuteman" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#1b2c4c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1322" media="(prefers-color-scheme: dark)" />
    <script type="module" src="/src/contacts/main.ts" defer></script>
  </head>

  <!-- Minuteman Contacts (src/contacts/main.ts): the box that searches, adds
       and acts, the list, and the open card. -->
  <body class="contacts-page">
    <div class="chrome contacts-chrome">
      <header class="topbar">
        <div>
          <div class="title-row">
            <h1>Contacts</h1>
          </div>
          <p id="account" class="account"></p>
        </div>
        <div class="actions">
          <button id="calendar" class="icon-button" title="Open Minuteman" aria-label="Calendar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2" /><path d="M3.5 10h17M8 3v4M16 3v4" /></svg>
          </button>
          <button id="refresh" class="icon-button" title="Refresh" aria-label="Refresh">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" /><path d="M20 4v4.5h-4.5" /></svg>
          </button>
          <button id="new-contact" class="icon-button" title="New contact (⌘N)" aria-label="New contact">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15" /></svg>
          </button>
        </div>
      </header>
      <!-- The box: search, add someone, or "call Sam". -->
      <div class="toolbar contacts-bar">
        <input
          id="ask"
          class="text-input contacts-input"
          type="search"
          placeholder="Search, add “Jane Doe jane@example.com”, or “call Sam”"
          aria-label="Search, add someone, or say what to do"
          aria-describedby="hint"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
    </div>
    <div id="banner" aria-live="polite"></div>
    <main class="contacts-main">
      <section class="contacts-list-pane" aria-label="Contacts">
        <div id="hint" class="hint-row" aria-live="polite"></div>
        <div id="list" class="contacts-list" role="listbox" aria-label="People"></div>
      </section>
      <section id="card" class="contacts-card-pane" aria-live="polite"></section>
    </main>
  </body>
</html>
