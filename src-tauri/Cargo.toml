[package]
name = "calendar"
version = "0.1.0"
description = "A personal calendar app on top of Google Calendar"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP client for Google's APIs. rustls = TLS written in Rust, so no OpenSSL to install.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
futures = "0.3"
# OS keychain: Windows Credential Manager and macOS/iOS Keychain.
# Without these platform features keyring silently uses an in-memory mock store.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
chrono = "0.4"
thiserror = "2"

# Desktop: pop-up alerts before events. (Not on iPhone, where they'd need to
# be scheduled ahead with iOS instead.)
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-notification = "2"

# iOS (and later Android): receives Google's sign-in redirect as a deep link.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-deep-link = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
