<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- viewport-fit=cover: draw edge to edge on phones; CSS keeps content clear of the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Minuteman</title>
    <!-- The logo in browser tabs, on a phone's home screen, and as an installed web app. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Minuteman" />
    <!-- Opened from the home screen: full screen under iOS's own status bar,
         which takes the theme colour (the header's navy). Not black-translucent:
         on iOS 26 that leaves the page a status bar's height short of the
         bottom, in a strip iOS won't paint. iOS reads this only when the app
         is added to the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#1b2c4c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1322" media="(prefers-color-scheme: dark)" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- The navy header: on wide windows title, arrows, views and buttons share one row. -->
    <div class="chrome">
    <header class="topbar">
      <div>
        <!-- The month in view; clicking it goes back to today. -->
        <!-- Phones move the ‹ › buttons in here, beside the title. -->
        <div id="title-row" class="title-row">
          <h1><button id="title" class="title-button">Minuteman</button></h1>
        </div>
        <p id="account" class="account"></p>
      </div>
      <div id="actions" class="actions" hidden>
        <button id="search" class="icon-button" title="Search (/)" aria-label="Search">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5 21 21" /></svg>
        </button>
        <button id="new-event" class="icon-button" title="New event (N)" aria-label="New event">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15" /></svg>
        </button>
        <button id="refresh" class="icon-button" title="Refresh" aria-label="Refresh">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" /><path d="M20 4v4.5h-4.5" /></svg>
        </button>
        <button id="settings" class="icon-button" title="Settings (,)" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" /></svg>
        </button>
      </div>
    </header>
    <nav id="toolbar" class="toolbar" aria-label="Calendar navigation" hidden>
      <div class="nav-buttons">
        <button id="prev" class="icon-button" title="Previous (&#x2190;)" aria-label="Previous">&#x2039;</button>
        <button id="today" class="pill-button" title="Today (T)">Today</button>
        <button id="next" class="icon-button" title="Next (&#x2192;)" aria-label="Next">&#x203a;</button>
      </div>
      <div id="view-switcher" class="segmented" role="group" aria-label="View"></div>
    </nav>
    </div>
    <div id="banner" aria-live="polite"></div>
    <main id="app"></main>
    <!-- Phones: the menu, Search and New event float at the bottom, within thumb's reach. -->
    <div id="dock" class="dock" hidden>
      <div class="dock-menu">
        <button id="menu-button" class="dock-button" aria-label="Menu" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
        <div id="menu" class="menu" role="menu" aria-label="Menu" hidden></div>
      </div>
      <button id="dock-search" class="dock-button" aria-label="Search">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5 21 21" /></svg>
      </button>
      <button id="dock-new" class="dock-button dock-new" aria-label="New event">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
      </button>
    </div>
  </body>
</html>
