<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- viewport-fit=cover: draw edge to edge on phones; CSS keeps content clear of the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Calendar</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header class="topbar">
      <div>
        <h1 id="title">Calendar</h1>
        <p id="account" class="account"></p>
      </div>
      <div id="actions" class="actions" hidden>
        <button id="new-event" class="icon-button" title="New event (N)" aria-label="New event">+</button>
        <button id="refresh" class="icon-button" title="Refresh" aria-label="Refresh">&#x21bb;</button>
        <button id="todoist" class="text-button" title="Connect Todoist">Todoist</button>
        <button id="accounts" class="text-button" title="Google accounts">Accounts</button>
      </div>
    </header>
    <nav id="toolbar" class="toolbar" aria-label="Calendar navigation" hidden>
      <div class="nav-buttons">
        <button id="today" class="pill-button" title="Today (T)">Today</button>
        <button id="prev" class="icon-button" title="Previous (&#x2190;)" aria-label="Previous">&#x2039;</button>
        <button id="next" class="icon-button" title="Next (&#x2192;)" aria-label="Next">&#x203a;</button>
      </div>
      <div id="view-switcher" class="segmented" role="group" aria-label="View"></div>
    </nav>
    <div id="banner" aria-live="polite"></div>
    <main id="app"></main>
  </body>
</html>
