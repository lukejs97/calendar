# Publishes the small website in site/ (home page and privacy policy, which
# Google's OAuth Branding page links to) to GitHub Pages:
# https://lukejs97.github.io/minuteman/
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". Then it runs on every push to main that changes the
# site, the README, or the logos in public/, and from the Actions tab.
name: Publish website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "README.md"
      - "public/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. An in-progress deploy is not cancelled:
# aborting actions/deploy-pages can leave that deployment stuck, and later
# pushes then fail until it is cleared. A newer push still replaces a run
# that is only waiting, so two publishes never run together. This group is
# separate from deploy-web.yml, which uploads a Cloudflare Worker.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The logo, from the app's own copies.
      - name: Add the logo
        run: cp public/favicon.svg public/icon-512.png site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
