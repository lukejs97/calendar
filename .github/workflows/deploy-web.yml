# Puts the website version (web/) online on Cloudflare Workers, as
# `npm run deploy` in web/ does on your own computer.
#
# Runs on every push to main that can change the Worker or the UI it serves
# (docs, the README, site/, and the desktop Rust app are skipped), and from
# the repo's Actions tab ("Deploy web app" → "Run workflow").
#
# Needs a repository secret (Settings → Secrets and variables → Actions):
# CLOUDFLARE_API_TOKEN, made in Cloudflare → My Profile → API Tokens → Create
# Token → "Edit Cloudflare Workers". If your Cloudflare login belongs to more
# than one account, also add CLOUDFLARE_ACCOUNT_ID (Workers & Pages overview →
# Account ID). The site's own secrets (Google client, TOKEN_KEY) stay on
# Cloudflare from the first setup; deploying keeps them.

name: Deploy web app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      # The Worker deploy builds the shared UI (repo root) and web/.
      # Docs, the GitHub Pages site, and the desktop Rust app are not in it.
      - "**.md"
      - "docs/**"
      - "site/**"
      - "src-tauri/**"
      - ".vscode/**"
      - ".github/workflows/build-macos.yml"
      - ".github/workflows/build-windows.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

# Cloudflare Worker, not GitHub Pages. A newer push cancels an in-progress
# deploy of this workflow so two uploads are not in flight together.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN under Settings → Secrets and variables → Actions (see the top of this file)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - run: npm ci

      - run: npm ci
        working-directory: web

      # Builds the site (../dist), then uploads it and the Worker.
      - name: Deploy
        working-directory: web
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          npm run deploy
