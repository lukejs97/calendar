# Builds the Mac desktop app on GitHub's Macs and attaches the installer
# (.dmg) to the run, so a Mac can install it without any developer tools.
#
# Runs on every push to main (docs, the README, site/, and web/ are skipped),
# and from the repo's Actions tab ("Build macOS app" → "Run workflow").
# Download "Minuteman-macOS" from the finished run's Artifacts section.
# The installer is an Actions artifact only; this workflow does not publish
# a GitHub Release.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
# GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET, the same values as in src-tauri/.env.
#
# Optional third secret, MAC_SIGNING_CERT: your own signing certificate (see
# docs/mac-signing.md). Signed with it, every build is the same app to macOS's
# privacy permissions (Calendars, Reminders, Location), so they last across
# updates. (The keychain still asks after updates: that needs Apple's Team ID.)

name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      # Not part of the desktop app, so they would not change the installer.
      - "**.md"
      - "docs/**"
      - "site/**"
      - "web/**"
      - ".vscode/**"
      - ".github/workflows/build-windows.yml"
      - ".github/workflows/deploy-web.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

# A newer push cancels an in-progress build of this workflow.
concurrency:
  group: build-macos
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - name: Check the Google secrets are set
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::Add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Both Mac chip types, so the app runs on Apple Silicon and Intel Macs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Set up the signing certificate
        env:
          MAC_SIGNING_CERT: ${{ secrets.MAC_SIGNING_CERT }}
        run: |
          if [ -z "$MAC_SIGNING_CERT" ]; then
            echo "No MAC_SIGNING_CERT secret: signing ad hoc (Calendar and Location permissions reset with each update)."
            exit 0
          fi
          # A keychain of its own for this run, holding just the certificate.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          printf '%s' "$MAC_SIGNING_CERT" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # The .p12's password isn't a secret: the file itself is (docs/mac-signing.md).
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 -P minuteman -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Let codesign find it, alongside the usual keychains.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Tauri signs with this identity (the certificate's name).
          echo "APPLE_SIGNING_IDENTITY=Minuteman Signing" >> "$GITHUB_ENV"

      - name: Build
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg

      # Tauri signs the .dmg as well as the app. Signed with our own (not an
      # Apple-issued) certificate, macOS would want "Open Anyway" for the disk
      # image too; unsigned, it just opens. Only the app inside needs signing.
      - name: Unsign the disk image
        run: |
          for dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            if codesign --display "$dmg" 2> /dev/null; then
              codesign --remove-signature "$dmg" \
                || { hdiutil convert "$dmg" -format UDZO -o "$dmg.unsigned.dmg" > /dev/null && mv "$dmg.unsigned.dmg" "$dmg"; }
            fi
            codesign --display "$dmg" 2>&1 | head -1
          done

      - name: Show how the app is signed
        run: |
          # The app as installed: inside the .dmg.
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          mount="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg" > /dev/null
          app=$(ls -d "$mount"/*.app | head -1)
          # Only reports: without a certificate the app isn't signed, as before.
          if codesign --verify "$app" 2> /dev/null; then
            codesign --display --verbose=2 "$app" 2>&1 | grep -E "^(Identifier|Authority|Signature)=" || true
            codesign --display --requirements - "$app" 2>&1 | grep designated || true
          else
            echo "Not signed with a certificate (docs/mac-signing.md)."
          fi
          hdiutil detach "$mount" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: Minuteman-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
