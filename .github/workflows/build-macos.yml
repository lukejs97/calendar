# Builds the Mac desktop app on GitHub's Macs and attaches the installer
# (.dmg) to the run, so a Mac can install it without any developer tools.
#
# Run it from the repo's Actions tab ("Build macOS app" → "Run workflow"),
# then download "Calendar-macOS" from the finished run's Artifacts section.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
# GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET, the same values as in src-tauri/.env.

name: Build macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - name: Check the Google secrets are set
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::Add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Both Mac chip types, so the app runs on Apple Silicon and Intel Macs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Calendar-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
