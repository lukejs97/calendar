# Builds the Windows desktop app on GitHub's Windows machines and attaches
# the installer (Minuteman_x.y.z_x64-setup.exe) to the run, so a Windows PC
# can install it without any developer tools.
#
# Run it from the repo's Actions tab ("Build Windows app" → "Run workflow"),
# then download "Minuteman-Windows" from the finished run's Artifacts section.
#
# Needs the same two repository secrets as the Mac build (Settings → Secrets
# and variables → Actions): GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET.
#
# The installer isn't signed with a Windows code-signing certificate (they
# cost money), so the first time each version runs, Windows SmartScreen says
# "Windows protected your PC": click "More info", then "Run anyway".

name: Build Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - name: Check the Google secrets are set
        shell: bash
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::Add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The installer (NSIS) installs for your Windows user only, without
      # asking for an administrator, and fetches WebView2 if it's missing.
      - name: Build
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: Minuteman-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
